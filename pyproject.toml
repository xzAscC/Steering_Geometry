[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steering_geometry"
version = "0.1.0"
requires-python = ">=3.12"
description = "Steering vector extraction and evaluation framework for LLM representation engineering"
dependencies = [
    "torch>=2.1,<3.0",
    "transformers>=4.36,<5.0",
    "datasets>=2.16,<3.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.4,<2.0",
    "accelerate>=1.13.0",
    "openai>=1.0.0,<2.0",
    "jinja2>=3.0.0,<4.0",
    "matplotlib>=3.8.0,<4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0.3",
    "pandas-stubs>=2.0,<3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
packages = ["steering_geometry"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
